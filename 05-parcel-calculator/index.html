</style><h1>택배비 계산소</h1><p>박스 크기로 부피무게를 계산하고 실제 무게와 비교합니다.</p><div class="card"><label>가로(cm)<input id="a" type="number" value="0"></label><label>세로(cm)<input id="b" type="number" value="0"></label><label>높이(cm)<input id="c" type="number" value="0"></label><label>실제 무게(kg)<input id="kg" type="number" value="0" step=".1"></label><label>부피무게 나누기 기준<input id="div" type="number" value="0"></label><button id="go">계산하기</button><h2>부피무게</h2><strong id="vol"></strong><p id="bill"></p><small>택배사·국가·계약에 따라 기준이 다르므로 실제 운임은 해당 택배사 기준을 확인하세요.</small></div><script>go.onclick=()=>{let A=Number(a.value),B=Number(b.value),C=Number(c.value),D=Number(div.value),K=Number(kg.value);if([A,B,C,D,K].some(x=>!Number.isFinite(x)||x<0)||A<=0||B<=0||C<=0||D<=0){vol.textContent='입력값 확인';bill.textContent='크기·실제 무게·나눗셈 기준은 0보다 커야 합니다.';return}let v=A*B*C/D;vol.textContent=v.toFixed(2)+'kg';bill.textContent='청구 기준 참고 무게: '+Math.max(v,K).toFixed(2)+'kg'};go.onclick=()=>{calc();document.querySelector('#vol')?.scrollIntoView({behavior:'smooth',block:'center'})}</script><p><a href="../">← 전체 도구</a></p></html>
