<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>택배 부피무게 계산기 무료 도구</title><meta name="description" content="박스의 가로·세로·높이와 실제 무게를 입력해 부피무게 및 참고 청구 무게를 계산하세요."><meta name="robots" content="index,follow"><link rel="canonical" href="https://ai-business-sites.pages.dev/05-parcel-calculator/"><link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>택배비 계산소 | 부피무게 계산</title><style>body{font:16px/1.6 system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f5f7fb;color:#182238}.card{background:white;padding:24px;border-radius:16px}label{display:block;margin:12px 0}input{display:block;padding:10px;width:95%}button{padding:12px;background:#3156d8;color:white;border:0;border-radius:8px}strong{font-size:28px;color:#3156d8}</style><h1>택배비 계산소</h1><p>박스 크기로 부피무게를 계산하고 실제 무게와 비교합니다.</p><div class="card"><label>가로(cm)<input id="a" type="number" value="30"></label><label>세로(cm)<input id="b" type="number" value="20"></label><label>높이(cm)<input id="c" type="number" value="15"></label><label>실제 무게(kg)<input id="kg" type="number" value="2" step=".1"></label><label>부피무게 나누기 기준<input id="div" type="number" value="6000"></label><button id="go">계산하기</button><h2>부피무게</h2><strong id="vol"></strong><p id="bill"></p><small>택배사·국가·계약에 따라 기준이 다르므로 실제 운임은 해당 택배사 기준을 확인하세요.</small></div><script>go.onclick=()=>{let v=+a.value*+b.value*+c.value/(+div.value||6000);vol.textContent=v.toFixed(2)+'kg';bill.textContent='청구 기준 참고 무게: '+Math.max(v,+kg.value).toFixed(2)+'kg'};go.onclick()</script><p><a href="../">← 전체 도구</a></p></html>
