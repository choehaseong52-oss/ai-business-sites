</style><h1>셀러툴박스</h1><p>상품 이미지를 원하는 크기로 일괄 변환합니다. 파일은 브라우저에서 처리됩니다.</p><div class="card"><input id="files" type="file" accept="image/*" multiple><br>가로 <input id="w" type="number" value="0"> 세로 <input id="h" type="number" value="0"><br><button id="go">변환 후 다운로드</button><p id="msg"></p></div><script>go.onclick=async()=>{let fs=[...files.files],W=+w.value,H=+h.value;if(!fs.length||W<1||H<1){msg.textContent='이미지와 크기를 확인하세요.';return}for(let f of fs){let im=new Image(),u=URL.createObjectURL(f);await new Promise(r=>{im.onload=r;im.src=u});let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d'),s=Math.min(W/im.width,H/im.height),dw=im.width*s,dh=im.height*s;x.fillStyle='white';x.fillRect(0,0,W,H);x.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);let b=await new Promise(r=>c.toBlob(r,'image/jpeg',.92)),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name.replace(/\.[^.]+$/,'')+'-'+W+'x'+H+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);URL.revokeObjectURL(u)}msg.textContent=fs.length+'개 변환 완료';msg.scrollIntoView({behavior:'smooth',block:'center'})}</script><p><a href="https://sellerlab.sellerlab.workers.makewayj.com/">← SELLER LAB 전체 도구</a></p></html>
