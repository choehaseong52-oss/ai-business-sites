<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 이미지 리사이즈 무료 도구 | 셀러툴박스</title><meta name="description" content="온라인 판매용 상품 이미지를 원하는 가로·세로 크기로 무료 변환하고 다운로드하세요."><meta name="robots" content="index,follow"><link rel="canonical" href="https://ai-business-sites.pages.dev/01-seller-toolbox/"><link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>셀러툴박스 | 이미지 리사이즈</title><style>body{font:16px/1.6 system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f5f7fb;color:#182238}.card{background:white;padding:24px;border-radius:16px}input,button{padding:12px;margin:8px 0}button{background:#3156d8;color:white;border:0;border-radius:8px}</style><h1>셀러툴박스</h1><p>상품 이미지를 원하는 크기로 일괄 변환합니다. 파일은 브라우저에서 처리됩니다.</p><div class="card"><input id="files" type="file" accept="image/*" multiple><br>가로 <input id="w" type="number" value="1000"> 세로 <input id="h" type="number" value="1000"><br><button id="go">변환 후 다운로드</button><p id="msg"></p></div><script>go.onclick=async()=>{let fs=[...files.files],W=+w.value,H=+h.value;if(!fs.length||W<1||H<1){msg.textContent='이미지와 크기를 확인하세요.';return}for(let f of fs){let im=new Image(),u=URL.createObjectURL(f);await new Promise(r=>{im.onload=r;im.src=u});let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d'),s=Math.min(W/im.width,H/im.height),dw=im.width*s,dh=im.height*s;x.fillStyle='white';x.fillRect(0,0,W,H);x.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);let b=await new Promise(r=>c.toBlob(r,'image/jpeg',.92)),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name.replace(/\.[^.]+$/,'')+'-'+W+'x'+H+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);URL.revokeObjectURL(u)}msg.textContent=fs.length+'개 변환 완료'}</script><p><a href="../">← 전체 도구</a></p></html>
