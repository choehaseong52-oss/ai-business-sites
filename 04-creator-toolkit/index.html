<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>크리에이터 툴킷 | 이미지 규격 변환</title><style>body{font:16px/1.6 system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f5f7fb;color:#182238}.card{background:white;padding:24px;border-radius:16px}button{padding:12px;margin:8px 6px 8px 0;background:#3156d8;color:white;border:0;border-radius:8px}</style><h1>크리에이터 툴킷</h1><p>유튜브 썸네일, 쇼츠·릴스, 정사각형 이미지 규격으로 변환합니다.</p><div class="card"><input id="file" type="file" accept="image/*"><p><button data-size="1280,720">유튜브 썸네일 1280×720</button><button data-size="1080,1920">쇼츠·릴스 1080×1920</button><button data-size="1080,1080">정사각형 1080×1080</button></p><p id="msg"></p></div><script>document.querySelectorAll('button[data-size]').forEach(b=>b.onclick=async()=>{let f=file.files[0];if(!f){msg.textContent='이미지를 선택하세요.';return}let [W,H]=b.dataset.size.split(',').map(Number),im=new Image(),u=URL.createObjectURL(f);await new Promise(r=>{im.onload=r;im.src=u});let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d'),s=Math.min(W/im.width,H/im.height),dw=im.width*s,dh=im.height*s;x.fillStyle='white';x.fillRect(0,0,W,H);x.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);let blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92)),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='creator-'+W+'x'+H+'.jpg';a.click();URL.revokeObjectURL(u);msg.textContent='변환 완료'} )</script><p><a href="../">← 전체 도구</a></p></html>
