  <text x="480" y="375" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="31">감이 아닌 데이터로 판단하고, 전략으로 성장하는 비즈니스.</text>
  <text x="480" y="444" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700">SELLER LAB INSIGHT</text>
  <text x="892" y="444" font-family="Georgia,'Times New Roman',serif" font-size="32">— Smarter Business, Better Growth.</text>
