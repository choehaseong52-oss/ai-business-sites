<g fill="#eee5dc">
  <text x="478" y="126" font-family="Georgia,'Times New Roman',serif" font-size="83" font-weight="700" letter-spacing="-2">SELLER LAB INSIGHT</text>
  <text x="480" y="205" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="39">온라인 셀러의 성장을 위한 실전 비즈니스 인사이트.</text>
  <text x="480" y="262" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="25">매출과 수익 분석부터 상품 소싱, 가격 전략, 광고 운영, 쇼핑몰 관리까지</text>
