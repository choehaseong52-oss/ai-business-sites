<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상품 원가·마진 계산기 무료 | SELLER LAB</title>
<meta name="description" content="상품 판매가, 매입 원가, 플랫폼 수수료와 기타 변동비를 입력해 예상 이익과 마진율을 계산하세요.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://sellerlab.sellerlab.workers.dev/02-owner-calculator/">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../sellerlab-tool.css">
<style>
body{font:16px/1.6 system-ui,-apple-system,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f5f7fb;color:#182238}
.card{background:white;padding:24px;border-radius:16px}
label{display:block;margin:12px 0}
input{display:block;padding:10px;width:95%}
button{padding:12px;background:#3156d8;color:white;border:0;border-radius:8px}
strong{font-size:28px;color:#3156d8}
*,*::before,*::after{box-sizing:border-box}
input,select,textarea,button{max-width:100%;font:inherit}
input,select,textarea{width:100%}
img,canvas,video{max-width:100%;height:auto}
body{max-width:100%;overflow-wrap:break-word}
@media(max-width:600px){body{margin:16px auto;padding-left:16px;padding-right:16px}.card,.panel,.result,.guide{padding:18px}button{min-height:44px}h1{font-size:clamp(25px,8vw,34px)}}
</style>
</head>
<body>
<p><a href="../">← SELLER LAB 전체 도구</a></p>
<main>
<h1>상품 원가·마진 계산기</h1>
<p>상품 판매가에서 매입 원가, 플랫폼 수수료와 기타 변동비를 차감해 예상 이익과 마진율을 확인하세요.</p>
<div class="card">
<label>판매가(원)<input id="p" type="number" min="0" value="0"></label>
<label>상품 원가(원)<input id="c" type="number" min="0" value="0"></label>
<label>수수료(%)<input id="f" type="number" min="0" max="100" step=".1" value="0"></label>
<label>기타 변동비(원)<input id="e" type="number" min="0" value="0"></label>
<button id="go" type="button">계산하기</button>
<h2>예상 이익</h2><strong id="out" aria-live="polite"></strong><p id="rate"></p>
</div>
</main>
<script>
const priceInput=document.getElementById('p');
const costInput=document.getElementById('c');
const feeInput=document.getElementById('f');
const extraInput=document.getElementById('e');
const output=document.getElementById('out');
const rateOutput=document.getElementById('rate');
function calc(){
 const P=Number(priceInput.value),fee=Number(feeInput.value),cost=Number(costInput.value),extra=Number(extraInput.value);
 if([P,fee,cost,extra].some(x=>!Number.isFinite(x)||x<0)||P<=0||fee>100){
  output.textContent='입력값을 확인하세요';
  rateOutput.textContent='판매가는 0보다 커야 하며 수수료율은 0~100% 범위여야 합니다.';
  return;
 }
 const V=P-P*fee/100-cost-extra;
 output.textContent=Math.round(V).toLocaleString('ko-KR')+'원';
 rateOutput.textContent='판매가 대비 마진율 '+(V/P*100).toFixed(1)+'%';
}
document.getElementById('go').addEventListener('click',()=>{
 calc();
 output.scrollIntoView({behavior:'smooth',block:'center'});
});
</script>
</body>
</html>
