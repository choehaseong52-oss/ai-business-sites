</style><h1>사장님 계산기</h1><p>메뉴 판매가에서 재료비·수수료·기타 변동비를 빼서 예상 잔액을 계산합니다.</p><div class="card"><label>판매가(원)<input id="p" type="number" value=""0"></label><label>재료 원가(원)<input id="c" type="number" value=""0"></label><label>수수료(%)<input id="f" type="number" value=""0" step=".1"></label><label>기타 변동비(원)<input id="e" type="number" value=""0"></label><button id="go">계산하기</button><h2>예상 잔액</h2><strong id="out"></strong><p id="rate"></p></div><script>function calc(){let P=Number(p.value),fee=Number(f.value),cost=Number(c.value),extra=Number(e.value);if([P,fee,cost,extra].some(x=>!Number.isFinite(x)||x<0)||P<=0||fee>100){out.textContent='입력값을 확인하세요';rate.textContent='판매가는 0보다 크고 수수료율은 0~100%여야 합니다.';return}let V=P-P*fee/100-cost-extra;out.textContent=Math.round(V).toLocaleString('ko-KR')+'원';rate.textContent='판매가 대비 마진율 '+(V/P*100).toFixed(1)+'%'}go.onclick=()=>{calc();document.querySelector('.result')?.scrollIntoView({behavior:'smooth',block:'start'})}</script><p><a href="../">← 전체 도구</a></p></html>
