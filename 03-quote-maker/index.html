<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>견적서·부가세 계산기 무료 도구 | 견적서메이커</title><meta name="description" content="공급가액과 할인율, 부가세율을 입력해 견적 합계와 세액을 간편하게 계산하세요."><meta name="robots" content="index,follow"><link rel="canonical" href="https://sellerlab.sellerlab.workers.dev/03-quote-maker/"><link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>견적서메이커 | 부가세 계산</title><style>body{font:16px/1.6 system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f5f7fb;color:#182238}.card{background:white;padding:24px;border-radius:16px}label{display:block;margin:12px 0}input{display:block;padding:10px;width:95%}button{padding:12px;margin:8px 6px 8px 0;background:#3156d8;color:white;border:0;border-radius:8px}strong{font-size:28px;color:#3156d8}</style><h1>견적서메이커</h1><p>공급가액, 할인율, 부가세를 반영해 최종 견적 금액을 계산합니다.</p><div class="card"><label>항목명<input id="name" value="서비스 제작"></label><label>공급가액(원)<input id="s" type="number" value="500000"></label><label>할인율(%)<input id="d" type="number" value="0"></label><label>부가세율(%)<input id="v" type="number" value="10"></label><button id="go">계산</button><button onclick="window.print()">인쇄 / PDF 저장</button><h2 id="n"></h2><strong id="total"></strong><p id="detail"></p></div><script>go.onclick=()=>{let S=+s.value*(1-+d.value/100),T=S*+v.value/100;n.textContent=name.value;total.textContent=Math.round(S+T).toLocaleString()+'원';detail.textContent='공급가액 '+Math.round(S).toLocaleString()+'원 / 부가세 '+Math.round(T).toLocaleString()+'원' };go.onclick()</script><p><a href="../">← 전체 도구</a></p></html>
