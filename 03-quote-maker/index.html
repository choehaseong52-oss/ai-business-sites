<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>견적서·부가세 계산기 무료 도구 | 견적서메이커</title><meta name="description" content="공급가액과 할인율, 부가세율을 입력해 견적 합계와 세액을 간편하게 계산하세요."><meta name="robots" content="index,follow"><link rel="canonical" href="https://sellerlab.sellerlab.workers.dev/03-quote-maker/"><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../sellerlab-tool.css"></head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>견적서메이커 | 부가세 계산</title><style>body{font:16px/1.6 system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f5f7fb;color:#182238}.card{background:white;padding:24px;border-radius:16px}label{display:block;margin:12px 0}input{display:block;padding:10px;width:95%}button{padding:12px;margin:8px 6px 8px 0;background:#3156d8;color:white;border:0;border-radius:8px}strong{font-size:28px;color:#3156d8}
/* Responsive safety: prevent form controls and media from overflowing narrow screens. */
*,*::before,*::after{box-sizing:border-box}input,select,textarea,button{max-width:100%;font:inherit}input,select,textarea{width:100%}img,canvas,video{max-width:100%;height:auto}body{max-width:100%;overflow-wrap:break-word}
@media(max-width:600px){body{margin:16px auto;padding-left:16px;padding-right:16px}.card,.panel,.result,.guide{padding:18px}button{min-height:44px}h1{font-size:clamp(25px,8vw,34px)}}
</style><h1>견적서메이커</h1><p>공급가액, 할인율, 부가세를 반영해 최종 견적 금액을 계산합니다.</p><div class="card"><label>항목명<input id="name" value="서비스 제작"></label><label>공급가액(원)<input id="s" type="number" value="0"></label><label>할인율(%)<input id="d" type="number" value="0"></label><label>부가세율(%)<input id="v" type="number" value="0"></label><button id="go">계산</button><button onclick="window.print()">인쇄 / PDF 저장</button><h2 id="n"></h2><strong id="total"></strong><p id="detail"></p></div><script>go.onclick=()=>{let price=Number(s.value),discount=Number(d.value),vat=Number(v.value);if([price,discount,vat].some(x=>!Number.isFinite(x)||x<0)||discount>100||vat>100){total.textContent='입력값 확인';detail.textContent='금액은 0 이상, 할인율과 부가세율은 0~100 사이로 입력하세요.';return}let S=price*(1-discount/100),T=S*vat/100;n.textContent=name.value;total.textContent=Math.round(S+T).toLocaleString('ko-KR')+'원';detail.textContent='공급가액 '+Math.round(S).toLocaleString('ko-KR')+'원 / 부가세 '+Math.round(T).toLocaleString('ko-KR')+'원' };go.onclick=()=>{calc();document.querySelector('#total')?.scrollIntoView({behavior:'smooth',block:'center'})}</script><p><a href="../">← 전체 도구</a></p></html>
